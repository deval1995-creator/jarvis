<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>J.A.R.V.I.S.</title>
<style>
  :root {
    --bg: #020a18; --panel: rgba(6, 22, 44, .62); --line: rgba(80, 190, 255, .28); --line-hi: rgba(110, 210, 255, .7);
    --c: #5cc8ff; --c-hi: #bfe9ff; --text: #cfe9ff; --muted: #5f86a6; --warn: #ffb547; --bad: #ff6b6b; --good: #4fe3a1;
    --mono: ui-monospace, "Cascadia Mono", Consolas, "SF Mono", monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; color: var(--text); font: 13px/1.45 var(--mono); overflow: hidden;
    background:
      radial-gradient(ellipse at 50% 42%, rgba(20, 70, 130, .55), transparent 60%),
      repeating-linear-gradient(0deg, rgba(80, 190, 255, .035) 0 1px, transparent 1px 44px),
      repeating-linear-gradient(90deg, rgba(80, 190, 255, .035) 0 1px, transparent 1px 44px),
      var(--bg);
    display: grid; grid-template-columns: 330px 1fr 360px; grid-template-rows: 64px 1fr auto 64px;
    gap: 14px; padding: 14px 18px;
  }
  body::after { content: ""; position: fixed; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse at center, transparent 55%, rgba(0, 0, 0, .55)); }
  .glow { text-shadow: 0 0 8px rgba(92, 200, 255, .65); }
  h2 { margin: 0 0 8px; font-size: 11px; font-weight: 600; letter-spacing: .22em; color: var(--c); text-transform: uppercase; }
  h2 .count { color: var(--bg); background: var(--warn); border-radius: 2px; padding: 0 5px; margin-left: 6px; letter-spacing: 0; }

  /* panels with HUD corner brackets */
  .panel { position: relative; background: var(--panel); border: 1px solid var(--line); padding: 12px 14px;
           backdrop-filter: blur(2px); min-height: 0; }
  .panel::before, .panel::after { content: ""; position: absolute; width: 12px; height: 12px; border: 2px solid var(--c); }
  .panel::before { top: -2px; left: -2px; border-right: 0; border-bottom: 0; }
  .panel::after { bottom: -2px; right: -2px; border-left: 0; border-top: 0; }

  /* top bar */
  header { grid-column: 1 / -1; display: flex; align-items: center; gap: 18px; border-bottom: 1px solid var(--line); padding-bottom: 8px; }
  .brand { font-size: 20px; letter-spacing: .38em; color: var(--c-hi); }
  .brand small { display: block; font-size: 10px; letter-spacing: .3em; color: var(--muted); }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; }
  .chip { border: 1px solid var(--line); padding: 2px 8px; font-size: 11px; letter-spacing: .08em; color: var(--muted); }
  .chip.on { color: var(--c); border-color: var(--line-hi); }
  .chip.warn { color: var(--warn); border-color: var(--warn); }
  .spacer { flex: 1; }
  .clock { text-align: right; }
  .clock .t { font-size: 30px; letter-spacing: .08em; color: var(--c-hi); line-height: 1; }
  .clock .d { font-size: 11px; letter-spacing: .2em; color: var(--muted); }

  /* left */
  #left { grid-column: 1; grid-row: 2 / 4; display: flex; flex-direction: column; gap: 14px; min-height: 0; }
  .sys { display: grid; grid-template-columns: 1fr auto; gap: 3px 10px; font-size: 12px; }
  .sys .k { color: var(--muted); letter-spacing: .06em; }
  .sys .v { text-align: right; }
  .v.ok { color: var(--good); } .v.off { color: var(--muted); } .v.warn { color: var(--warn); } .v.bad { color: var(--bad); }
  #mempanel { max-height: 50%; display: flex; flex-direction: column; min-height: 0; }
  #mempanel .scroll { overflow-y: auto; min-height: 0; flex: 1; padding-right: 4px; }
  #mempanel[hidden] { display: none; }
  .item { border-left: 2px solid var(--line); padding: 4px 8px; margin-bottom: 6px; font-size: 12px; }
  .item.pending { border-left-color: var(--warn); }
  .item .tag { font-size: 10px; color: var(--muted); letter-spacing: .06em; text-transform: uppercase; }
  .item .why { font-size: 11px; color: var(--warn); }
  .item .actions { display: flex; gap: 6px; margin-top: 4px; }
  .item input[type=text] { width: 100%; margin-top: 4px; }
  .empty { color: var(--muted); font-size: 12px; }

  /* centre */
  #centre { grid-column: 2; grid-row: 2; position: relative; display: flex; flex-direction: column; align-items: center;
            justify-content: center; min-height: 0; overflow: hidden; }
  #orb { width: min(100%, 60vh); aspect-ratio: 1; flex: none; }
  #vlabel { position: absolute; top: 4px; left: 0; font-size: 11px; letter-spacing: .25em; color: var(--muted); }
  #subs { width: min(100%, 760px); text-align: center; min-height: 76px; flex: none; }
  #subs .you { color: var(--muted); font-size: 12px; letter-spacing: .04em; }
  #subs .you:not(:empty)::before { content: "▸ "; color: var(--c); }
  #subs .reply { color: var(--c-hi); font-size: 15px; margin-top: 4px; max-height: 4.5em; overflow: hidden;
                 display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; }

  /* bottom centre numbers */
  #numbers { grid-column: 2; grid-row: 3; justify-self: center; display: flex; border-color: var(--line-hi);
             box-shadow: 0 0 24px rgba(92, 200, 255, .15) inset; padding: 10px 6px; }
  .num { padding: 0 22px; text-align: center; border-right: 1px solid var(--line); }
  .num:last-child { border-right: 0; }
  .num .n { font-size: 26px; color: var(--c-hi); line-height: 1.1; }
  .num .l { font-size: 10px; letter-spacing: .2em; color: var(--muted); text-transform: uppercase; }
  .num .n.ok { color: var(--good); } .num .n.slow { color: var(--warn); }

  /* right */
  #right { grid-column: 3; grid-row: 2 / 4; display: flex; flex-direction: column; gap: 14px; min-height: 0; }
  .gaugebox { display: flex; gap: 14px; align-items: center; }
  #gauge { width: 96px; height: 96px; flex: none; }
  .gaugebox .sys { flex: 1; }
  #transcript { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  #log { overflow-y: auto; flex: 1; min-height: 0; padding-right: 4px; display: flex; flex-direction: column; gap: 8px; }
  .msg { white-space: pre-wrap; word-break: break-word; font-size: 12px; }
  .msg .who { font-size: 10px; letter-spacing: .2em; color: var(--muted); display: block; }
  .msg.user .who { color: var(--c); }
  .msg.assistant { color: var(--c-hi); }
  .msg.cut .body::after { content: " [interrupted]"; color: var(--muted); }
  .note { font-size: 11px; color: var(--muted); }
  .note.err, .err { color: var(--bad); }

  /* footer */
  footer { grid-column: 1 / -1; display: flex; gap: 10px; align-items: center; border-top: 1px solid var(--line); padding-top: 10px; }
  textarea, input[type=search], input[type=text], select {
    font: inherit; color: var(--text); background: rgba(4, 16, 32, .8); border: 1px solid var(--line); padding: 8px 10px; outline: none; }
  textarea:focus, input:focus, select:focus { border-color: var(--line-hi); box-shadow: 0 0 10px rgba(92, 200, 255, .25); }
  textarea { flex: 1; resize: none; height: 40px; }
  input[type=search] { width: 100%; }
  button { font: inherit; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--c);
           background: transparent; border: 1px solid var(--line-hi); padding: 8px 12px; cursor: pointer; }
  button:hover { background: rgba(92, 200, 255, .1); }
  button:disabled { opacity: .35; cursor: default; }
  button.primary { background: rgba(92, 200, 255, .18); color: var(--c-hi); }
  .item button { padding: 3px 8px; font-size: 10px; }
  #talk { user-select: none; touch-action: none; min-width: 130px; }
  #talk.held { background: var(--c); color: var(--bg); box-shadow: 0 0 18px var(--c); }

  /* approval pop-up */
  #modal { position: fixed; inset: 0; display: none; place-items: center; background: rgba(0, 5, 15, .6); z-index: 10; }
  #modal.show { display: grid; }
  .approval { width: min(560px, 92vw); background: #04142a; border: 1px solid var(--warn); padding: 18px 20px;
              box-shadow: 0 0 40px rgba(255, 181, 71, .2); }
  .approval h3 { margin: 0 0 10px; color: var(--warn); font-size: 13px; letter-spacing: .2em; text-transform: uppercase; }
  .approval dl { display: grid; grid-template-columns: max-content 1fr; gap: 4px 14px; margin: 0; }
  .approval dt { color: var(--muted); text-transform: uppercase; font-size: 11px; letter-spacing: .1em; }
  .approval dd { margin: 0; white-space: pre-wrap; word-break: break-word; }
  .approval .warn { color: var(--warn); font-size: 12px; margin-top: 10px; }
  .approval .actions { display: flex; gap: 10px; margin-top: 14px; }
  .approval .actions .primary { border-color: var(--good); color: var(--good); background: rgba(79, 227, 161, .1); }


  /* windows Jarvis opens */
  .win { position: fixed; z-index: 5; width: min(640px, 46vw); max-height: 86vh; display: flex; flex-direction: column;
         background: rgba(3, 14, 30, .95); border: 1px solid var(--line-hi);
         box-shadow: 0 0 30px rgba(92, 200, 255, .18), inset 0 0 40px rgba(92, 200, 255, .05);
         resize: both; overflow: hidden; min-width: 280px; min-height: 140px;
         animation: winIn .45s cubic-bezier(.2, .9, .3, 1.2); }
  .win.size-small { width: min(380px, 90vw); }
  .win.size-medium { width: min(640px, 90vw); }
  .win.size-large { width: min(940px, 94vw); max-height: 88vh; }
  .win.size-full { width: calc(100vw - 48px); height: calc(100vh - 100px); max-height: none; }
  .win.closing { animation: winOut .25s ease-in forwards; }
  @keyframes winIn { 0% { opacity: 0; transform: scale(.6) translateY(30px); clip-path: inset(48% 0 48% 0); }
                     55% { opacity: 1; clip-path: inset(0 0 0 0); } 100% { transform: none; } }
  @keyframes winOut { to { opacity: 0; transform: scale(.85); } }
  .win::before, .win::after { content: ""; position: absolute; width: 14px; height: 14px; border: 2px solid var(--c); }
  .win::before { top: 0; left: 0; border-right: 0; border-bottom: 0; }
  .win::after { bottom: 0; right: 0; border-left: 0; border-top: 0; pointer-events: none; }
  .win .bar { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-bottom: 1px solid var(--line);
              cursor: move; user-select: none; background: linear-gradient(90deg, rgba(92, 200, 255, .14), transparent); }
  .win .bar .t { color: var(--c-hi); letter-spacing: .18em; text-transform: uppercase; font-size: 12px; flex: 1; }
  .win .bar .sub { color: var(--muted); font-size: 11px; }
  .win .bar button { padding: 2px 8px; }
  .win .body { overflow: auto; padding: 12px 14px; min-height: 0; flex: 1; }
  .win .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; margin-bottom: 12px; }
  .win .stat { border: 1px solid var(--line); padding: 6px 10px; }
  .win .stat .v { font-size: 19px; color: var(--c-hi); }
  .win .stat .l { font-size: 10px; letter-spacing: .15em; color: var(--muted); text-transform: uppercase; }
  .up { color: var(--good) !important; } .down { color: var(--bad) !important; } .warnc { color: var(--warn) !important; }
  .win table { width: 100%; border-collapse: collapse; font-size: 12px; font-variant-numeric: tabular-nums; }
  .win th { text-align: left; color: var(--c); font-weight: 600; font-size: 10px; letter-spacing: .12em; text-transform: uppercase;
            border-bottom: 1px solid var(--line-hi); padding: 4px 8px; position: sticky; top: 0; background: #031226; }
  .win td { padding: 4px 8px; border-bottom: 1px solid rgba(80, 190, 255, .1); white-space: nowrap; }
  .win td.num, .win th.num { text-align: right; }
  .win tr:hover td { background: rgba(92, 200, 255, .06); }
  .win .items { display: flex; flex-direction: column; gap: 6px; }
  .win .it { display: grid; grid-template-columns: 130px 1fr; gap: 10px; border-left: 2px solid var(--c); padding: 4px 10px;
             background: rgba(92, 200, 255, .04); }
  .win .it .w { color: var(--c); font-size: 12px; }
  .win .it .d { color: var(--muted); font-size: 11px; }
  .win .note { margin-top: 10px; font-size: 11px; color: var(--muted); }
  .win .pgrid { display: grid; gap: 12px; }
  .win .panelw { min-width: 0; }
  .win .panelw h4 { margin: 0 0 6px; font-size: 10px; font-weight: 600; letter-spacing: .2em; color: var(--c); text-transform: uppercase; }
  .win .stats { margin-bottom: 0; }
  .win .tablewrap { overflow-x: auto; }
  .win .wtext { white-space: pre-wrap; color: var(--text); font-size: 13px; line-height: 1.55; }
  .win canvas.wchart, .win canvas.wgraph { display: block; width: 100%; border: 1px solid var(--line);
      background: radial-gradient(ellipse at center, rgba(20, 70, 130, .3), transparent 75%); }
  .win canvas.wchart { height: 230px; } .win canvas.wchart.small { height: 160px; }
  .win canvas.wchart.large { height: 260px; } .win canvas.wchart.full { height: 32vh; }
  .win canvas.wgraph { height: 360px; } .win canvas.wgraph.large { height: min(520px, 56vh); }
  .win canvas.wgraph.full { height: 62vh; }
  .win::-webkit-resizer { background: linear-gradient(135deg, transparent 50%, var(--c) 50%); }

  ::-webkit-scrollbar { width: 6px; } ::-webkit-scrollbar-thumb { background: var(--line); }
  @media (max-width: 1100px) { body { grid-template-columns: 1fr; grid-template-rows: auto; overflow: auto; }
    #left, #right, #centre, #numbers, header, footer { grid-column: 1; grid-row: auto; } }
</style>
</head>
<body>
<header>
  <div class="brand glow">J.A.R.V.I.S.<small>PERSONAL ASSISTANT · LOCAL CORE</small></div>
  <div class="chips">
    <span class="chip" id="chip-core">CORE</span>
    <span class="chip" id="chip-mic">MIC OFF</span>
    <span class="chip warn" id="chip-untrusted" hidden>READ OUTSIDE CONTENT</span>
  </div>
  <span class="spacer"></span>
  <div class="clock"><div class="t glow" id="clock">--:--:--</div><div class="d" id="date"></div></div>
</header>

<section id="left">
  <div class="panel">
    <h2>Systems</h2>
    <div class="sys" id="systems"></div>
  </div>
  <div class="panel" id="mempanel" hidden>
    <h2>Needs your approval <span class="count" id="inboxCount"></span></h2>
    <div class="scroll" id="inbox"></div>
  </div>
</section>

<section id="centre">
  <div id="vlabel">VOICE · <span id="vstate">MIC OFF</span></div>
  <canvas id="orb"></canvas>
  <div id="subs"><div class="you" id="subYou"></div><div class="reply" id="subReply">Good evening, sir.</div></div>
</section>

<div class="panel" id="numbers">
  <div class="num"><div class="n" id="n-turns">–</div><div class="l">Turns today</div></div>
  <div class="num"><div class="n" id="n-tokens">–</div><div class="l">Tokens out</div></div>
  <div class="num"><div class="n" id="n-claude">–</div><div class="l">Claude first text</div></div>
  <div class="num"><div class="n" id="n-audio">–</div><div class="l">First audio</div></div>
</div>

<section id="right">
  <div class="panel">
    <h2>Response</h2>
    <div class="gaugebox">
      <canvas id="gauge"></canvas>
      <div class="sys" id="lat"></div>
    </div>
  </div>
  <div class="panel" id="transcript">
    <h2>Transcript</h2>
    <div id="log"></div>
  </div>
</section>

<footer>
  <select id="vmode" title="Microphone">
    <option value="off">Mic off</option>
    <option value="ptt">Push-to-talk</option>
    <option value="hands-free">Hands-free</option>
  </select>
  <button id="talk" type="button" disabled title="Hold to talk (or hold Space when not typing)">Hold to talk</button>
  <form id="chat" style="display:contents">
    <textarea id="input" placeholder="Message Jarvis · Enter to send · Shift+Enter new line · Esc to stop" autofocus></textarea>
    <button class="primary" type="submit">Send</button>
  </form>
  <button id="stop" type="button">Stop</button>
  <button id="newchat" type="button">New</button>
</footer>

<div id="modal"></div>

<script src="/static/voice.js"></script>
<script src="/static/orb.js"></script>
<script src="/static/graph.js"></script>
<script src="/static/chart.js"></script>
<script>
const TOKEN = "__JARVIS_TOKEN__";
const headers = { "X-Jarvis-Token": TOKEN, "Content-Type": "application/json" };
const $ = (id) => document.getElementById(id);
const log = $("log"), input = $("input");
let ws, current = null, coreUp = false, untrusted = false;

const api = (path, opts = {}) => fetch(path, { headers, ...opts }).then(async (r) => {
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).detail || r.statusText);
  return r.json();
});

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}
const scrollLog = () => { log.scrollTop = log.scrollHeight; };

// ---------- transcript and subtitles ----------
function add(role, text, source) {
  const m = el("div", "msg " + role);
  const who = role === "user" ? "YOU" + (source && source !== "typed" ? " · " + source.toUpperCase() : "") : "JARVIS";
  m.append(el("span", "who", who), el("span", "body", text));
  m.body = m.lastChild;
  log.append(m); scrollLog();
  return m;
}
function subtitle(you, reply) {
  if (you !== undefined) $("subYou").textContent = you;
  if (reply !== undefined) $("subReply").textContent = reply;
}

const TOOL_LABELS = { recall: "checked memory", get_profile: "loaded your profile", remember: "noted to memory",
                      update: "updated a memory", forget: "removed a memory", log: "added a journal entry",
                      search_threads: "searched Gmail", get_thread: "read an email", list_events: "checked the calendar",
                      search_events: "searched the calendar", get_event: "read an event",
                      show_window: "opened a window", close_window: "closed a window", network: "mapped the memory network",
                      get_account_positions: "read IBKR positions", get_account_summary: "read the IBKR account",
                      get_account_balances: "read IBKR balances", get_price_snapshot: "checked prices" };
function toolNote(name) {
  const short = name.replace(/^mcp__\w+?__/, "");
  const note = el("div", "note", "· " + (TOOL_LABELS[short] || "used " + short));
  log.insertBefore(note, current); scrollLog();
}

// ---------- approval cards (pop-up) ----------
const ACTION_TITLES = {
  send_message: "Send this email?", reply: "Send this reply?", create_draft: "Save this draft in Gmail?",
  create_event: "Create this calendar event?", update_event: "Change this calendar event?",
  respond_to_event: "Answer this invitation?",
};
const OUTCOMES = { approved: "approved", rejected: "rejected", expired: "expired: no answer in 10 minutes", cancelled: "cancelled" };
const cards = new Map();

function fmt(v) {
  if (Array.isArray(v)) return v.map(fmt).join(", ");
  if (v && typeof v === "object") return Object.entries(v).map(([k, x]) => `${k}: ${fmt(x)}`).join("\n");
  return String(v);
}
const shortTool = (tool) => tool.replace(/^mcp__\w+?__/, "");
const actionTitle = (tool) => ACTION_TITLES[shortTool(tool)] || `Allow ${shortTool(tool)}?`;

function approvalCard(a) {
  const c = el("div", "approval panel");
  c.append(el("h3", "", "⚠ " + actionTitle(a.tool)));
  const dl = el("dl");
  for (const [k, v] of Object.entries(a.arguments)) {
    if (v === null || v === "" || (Array.isArray(v) && !v.length)) continue;
    dl.append(el("dt", "", k.replace(/_/g, " ")), el("dd", "", fmt(v)));
  }
  c.append(dl);
  if (a.untrusted) c.append(el("div", "warn",
    "This conversation has read email or calendar content written by other people. Check this is what you asked for."));
  const actions = el("div", "actions");
  const yes = el("button", "primary", "Approve"), no = el("button", "", "Reject");
  yes.onclick = () => api(`/api/approvals/${a.id}/approve`, { method: "POST" }).catch((e) => alert(e.message));
  no.onclick = () => api(`/api/approvals/${a.id}/reject`, { method: "POST" }).catch((e) => alert(e.message));
  actions.append(yes, no); c.append(actions);
  cards.set(a.id, c);
  return c;
}
function showApproval(a) {
  if (cards.has(a.id) || a.status !== "pending") return;
  $("modal").append(approvalCard(a));
  $("modal").classList.add("show");
  subtitle(undefined, "Your approval is needed, sir.");
}
function settleCard(a) {
  const c = cards.get(a.id);
  if (c) { c.remove(); cards.delete(a.id); }
  if (!$("modal").children.length) $("modal").classList.remove("show");
  log.append(el("div", "note", `· ${actionTitle(a.tool).replace("?", "")}: ${OUTCOMES[a.status] || a.status}`)); scrollLog();
}
async function loadApprovals() { for (const a of await api("/api/approvals")) showApproval(a); }

// ---------- memory ----------
function describe(p) {
  if (p.action === "forget") return "Forget: " + p.text;
  if (p.action === "update") return "Change to: " + p.text;
  return p.text;
}
function proposalCard(p) {
  const c = el("div", "item pending");
  c.append(el("div", "tag", [p.action, p.kind, p.category, p.confidence && p.confidence < 1 ? "inferred" : null]
    .filter(Boolean).join(" · ")));
  c.append(el("div", "", describe(p)));
  if (p.review_reason) c.append(el("div", "why", p.review_reason));
  const actions = el("div", "actions");
  const yes = el("button", "primary", "Approve"), edit = el("button", "", "Edit"), no = el("button", "", "Reject");
  let editor = null;
  edit.onclick = () => {
    if (editor || p.action === "forget") return;
    editor = el("input"); editor.type = "text"; editor.value = p.text;
    c.insertBefore(editor, actions); editor.focus();
  };
  yes.onclick = () => api(`/api/memory/proposals/${p.id}/approve`, { method: "POST",
    body: JSON.stringify(editor ? { text: editor.value } : {}) }).catch((e) => alert(e.message));
  no.onclick = () => api(`/api/memory/proposals/${p.id}/reject`, { method: "POST" }).catch((e) => alert(e.message));
  actions.append(yes);
  if (p.action !== "forget") actions.append(edit);
  actions.append(no);
  c.append(actions);
  return c;
}
async function loadInbox() {
  const items = await api("/api/memory/proposals");
  $("inbox").replaceChildren(...items.map(proposalCard));
  $("mempanel").hidden = !items.length;
  $("inboxCount").textContent = items.length;
}
// Memory stays in the background; the page only shows how many are saved.
let memCount = 0;
async function loadMemories() {
  memCount = (await api("/api/memory")).length;
  renderSystems();
}

// ---------- status panels ----------
let status = null;
const lastVoice = {}, lastCore = {};
function row(box, k, v, cls) { box.append(el("span", "k", k), el("span", "v " + (cls || ""), v)); }
function renderSystems() {
  const box = $("systems"); box.replaceChildren();
  const conn = status?.connectors || {};
  const cs = (name) => { const s = conn[name]; return s === "connected" ? ["ONLINE", "ok"] : s ? [s.toUpperCase(), "warn"] : ["—", "off"]; };
  row(box, "CORE", coreUp ? "ONLINE" : "OFFLINE", coreUp ? "ok" : "bad");
  row(box, "CLAUDE", status?.busy ? "WORKING" : status ? "READY" : "—", status?.busy ? "warn" : status ? "ok" : "off");
  row(box, "GMAIL", ...cs("claude.ai Gmail"));
  row(box, "CALENDAR", ...cs("claude.ai Google Calendar"));
  row(box, "IBKR", ...cs("claude.ai Interactive Brokers (IBKR)"));
  row(box, "MEMORY", memCount + " SAVED", "ok");
  const m = window.jarvisVoice.micState;
  row(box, "VOICE", m === "off" ? "OFF" : m === "ptt" ? "PUSH-TO-TALK" : "HANDS-FREE", m === "off" ? "off" : "ok");
  row(box, "CONVERSATION", untrusted ? "READ OUTSIDE MAIL" : "CLEAN", untrusted ? "warn" : "ok");
}
function renderNumbers() {
  const u = status?.usage_today_utc || {};
  $("n-turns").textContent = u.turns ?? "–";
  $("n-tokens").textContent = u.output_tokens !== undefined ? u.output_tokens.toLocaleString() : "–";
  const sec = (ms) => (ms === undefined || ms === null ? "–" : (ms / 1000).toFixed(1) + "s");
  $("n-claude").textContent = sec(lastCore.first_token_ms);
  $("n-audio").textContent = sec(lastVoice.first_audio);
  $("n-audio").className = "n " + (lastVoice.first_audio === undefined ? "" : lastVoice.first_audio <= 2500 ? "ok" : "slow");
  const lat = $("lat"); lat.replaceChildren();
  const ms = (x) => (x === undefined || x === null ? "–" : x + " ms");
  row(lat, "HEARD", ms(lastVoice.transcribe));
  row(lat, "FIRST AUDIO", ms(lastVoice.first_audio), lastVoice.first_audio > 2500 ? "warn" : "");
  row(lat, "CLAUDE", ms(lastCore.first_token_ms));
  row(lat, "TOTAL", ms(lastCore.total_ms));
  row(lat, "CUT-OFF", ms(lastVoice.interrupt), lastVoice.interrupt > 300 ? "warn" : "");
  drawGauge();
}
async function loadStatus() {
  try { status = await api("/api/status"); untrusted = status.untrusted; } catch { status = null; }
  $("chip-untrusted").hidden = !untrusted;
  renderSystems(); renderNumbers();
}

// The gauge: last first-audio time (or Claude's first text) against the 2.5 s target.
function drawGauge() {
  const cv = $("gauge"), dpr = devicePixelRatio || 1, S = 96;
  cv.width = cv.height = S * dpr; const g = cv.getContext("2d"); g.scale(dpr, dpr);
  const cx = S / 2, r = 38, v = lastVoice.first_audio ?? lastCore.first_token_ms;
  const frac = v === undefined || v === null ? 0 : Math.min(1, v / 2500);
  g.lineWidth = 6; g.strokeStyle = "rgba(80,190,255,.15)";
  g.beginPath(); g.arc(cx, cx, r, .75 * Math.PI, 2.25 * Math.PI); g.stroke();
  g.strokeStyle = frac >= 1 ? "#ffb547" : "#5cc8ff"; g.shadowColor = g.strokeStyle; g.shadowBlur = 8;
  g.beginPath(); g.arc(cx, cx, r, .75 * Math.PI, (.75 + 1.5 * frac) * Math.PI); g.stroke(); g.shadowBlur = 0;
  for (let i = 0; i <= 10; i++) {
    const a = (.75 + .15 * i) * Math.PI; g.strokeStyle = "rgba(160,220,255,.5)"; g.lineWidth = 1;
    g.beginPath(); g.moveTo(cx + Math.cos(a) * (r - 9), cx + Math.sin(a) * (r - 9));
    g.lineTo(cx + Math.cos(a) * (r - 5), cx + Math.sin(a) * (r - 5)); g.stroke();
  }
  g.fillStyle = "#bfe9ff"; g.font = "15px ui-monospace, Consolas, monospace"; g.textAlign = "center";
  g.fillText(v === undefined || v === null ? "–" : (v / 1000).toFixed(1) + "s", cx, cx + 4);
  g.fillStyle = "#5f86a6"; g.font = "8px ui-monospace, Consolas, monospace"; g.fillText("OF 2.5s", cx, cx + 17);
}

// ---------- the orb ----------
// ?demo=listening|thinking|speaking shows a state with a made-up voice (for previews).
const DEMO = new URLSearchParams(location.search).get("demo");
const demoBins = new Uint8Array(256);
new JarvisOrb($("orb"), () => {
  const v = window.jarvisVoice;
  if (DEMO) {
    const t = performance.now() / 1000, lvl = 0.35 + 0.3 * Math.abs(Math.sin(t * 3.1) * Math.sin(t * 1.7));
    for (let i = 0; i < 256; i++) demoBins[i] = Math.max(0, 230 * lvl * Math.exp(-i / 45) * (0.6 + 0.4 * Math.sin(t * 9 + i * 0.7)));
    return { state: DEMO, mic: lvl, out: lvl, spectrum: demoBins };
  }
  const lv = v.levels(), spec = v.spectrum();
  let state = v.state;
  if (state === "off" && status?.busy) state = "thinking";  // typed turns animate too
  return { state, mic: lv.mic, out: lv.out, spectrum: state === "listening" ? spec.mic : spec.out };
});

// ---------- clock ----------
function tick() {
  const d = new Date();
  $("clock").textContent = d.toLocaleTimeString([], { hour12: false });
  $("date").textContent = d.toLocaleDateString([], { weekday: "long", day: "numeric", month: "long", year: "numeric" }).toUpperCase();
}
setInterval(tick, 1000); tick();


// ---------- windows Jarvis opens (portfolio, calendar, ...) ----------
const wins = new Map();
let winZ = 6, winN = 0;
const isNum = (v) => /^[+\-−]?\s?[$€£₹]?\s?\d[\d,]*(\.\d+)?\s?%?$/.test(v.trim());
const toneOf = (v) => (/^\+/.test(v.trim()) ? "up" : /^[-−]\s?[$€£₹]?\s?\d/.test(v.trim()) ? "down" : "");
// One panel of a window: stats, table, items, chart, graph or text.
function renderPanel(pn, size) {
  const box = el("section", "panelw");
  if (pn.span > 1) box.style.gridColumn = `span ${pn.span}`;
  if (pn.title) box.append(el("h4", "", pn.title));
  if (pn.type === "stats") {
    const g = el("div", "stats");
    for (const st of pn.stats) {
      const c = el("div", "stat");
      const tone = { up: "up", down: "down", warn: "warnc" }[st.tone] || "";
      c.append(el("div", "v " + tone, st.value), el("div", "l", st.label));
      g.append(c);
    }
    box.append(g);
  } else if (pn.type === "table") {
    const tb = pn.table, wrap = el("div", "tablewrap"), t = el("table"), head = el("tr");
    const numeric = tb.columns.map((_, i) => tb.rows.length > 0 && tb.rows.every((r) => !r[i] || isNum(r[i])));
    tb.columns.forEach((c, i) => head.append(el("th", numeric[i] ? "num" : "", c)));
    t.append(head);
    for (const r of tb.rows) {
      const tr = el("tr");
      tb.columns.forEach((_, i) => tr.append(el("td", ((numeric[i] ? "num " : "") + toneOf(r[i] || "")).trim(), r[i] ?? "")));
      t.append(tr);
    }
    wrap.append(t); box.append(wrap);
  } else if (pn.type === "items") {
    const list = el("div", "items");
    for (const it of pn.items) {
      const row = el("div", "it"), right = el("div");
      right.append(el("div", "", it.title));
      if (it.detail) right.append(el("div", "d", it.detail));
      row.append(el("div", "w", it.when || ""), right);
      list.append(row);
    }
    box.append(list);
  } else if (pn.type === "text") {
    box.append(el("div", "wtext", pn.text));
  } else if (pn.type === "chart") {
    const cv = el("canvas", "wchart " + size);
    box.append(cv);
    requestAnimationFrame(() => new JarvisChart(cv, pn.chart));
  } else if (pn.type === "graph") {
    const cv = el("canvas", "wgraph " + size);
    box.append(cv);
    requestAnimationFrame(() => new JarvisGraph(cv, pn.graph));
  }
  return box;
}

const SIZE_W = { small: 380, medium: 640, large: 940 };
function renderWindow(w) {
  let box = wins.get(w.id);
  const fresh = !box;
  const size = w.size || "medium";
  if (fresh) {
    box = el("div", "win");
    wins.set(w.id, box); document.body.append(box);
  }
  box.className = "win size-" + size;
  if (fresh || box.dataset.size !== size) {  // place it: centred, cascading; full fills the screen
    box.style.width = box.style.height = "";
    if (size === "full") { box.style.left = "24px"; box.style.top = "70px"; }
    else {
      const k = winN++ % 5, width = Math.min(SIZE_W[size], innerWidth - 40);
      box.style.left = Math.max(10, (innerWidth - width) / 2 + (k - 2) * 28) + "px";
      box.style.top = 80 + k * 24 + "px";
    }
    box.dataset.size = size;
  }
  box.style.zIndex = ++winZ;
  box.replaceChildren();
  const bar = el("div", "bar"), close = el("button", "", "✕");
  bar.append(el("span", "t glow", w.title));
  if (w.subtitle) bar.append(el("span", "sub", w.subtitle));
  bar.append(close);
  close.onclick = () => api(`/api/windows/${w.id}`, { method: "DELETE" }).catch(() => dropWindow(w.id));
  const body = el("div", "body");
  const grid = el("div", "pgrid");
  grid.style.gridTemplateColumns = `repeat(${w.columns || 1}, minmax(0, 1fr))`;
  for (const pn of w.panels || []) grid.append(renderPanel(pn, size));
  if (!(w.panels || []).length) grid.append(el("div", "empty", "Nothing to show."));
  body.append(grid);
  if (w.note) body.append(el("div", "note", w.note));
  box.append(bar, body);
  if (!fresh) { box.style.animation = "none"; void box.offsetWidth; box.style.animation = ""; }
  bar.onpointerdown = (e) => {  // drag by the title bar
    if (e.target === close) return;
    box.style.zIndex = ++winZ;
    const r = box.getBoundingClientRect(), dx = e.clientX - r.left, dy = e.clientY - r.top;
    bar.setPointerCapture(e.pointerId);
    bar.onpointermove = (m) => { box.style.left = m.clientX - dx + "px"; box.style.top = Math.max(0, m.clientY - dy) + "px"; };
    bar.onpointerup = () => { bar.onpointermove = null; };
  };
  box.onpointerdown = () => { box.style.zIndex = ++winZ; };
}
function dropWindow(id) {
  const box = wins.get(id);
  if (!box) return;
  wins.delete(id);
  box.classList.add("closing");
  setTimeout(() => box.remove(), 260);
}
async function loadWindows() { for (const w of await api("/api/windows")) renderWindow(w); }

// ---------- chat ----------
async function loadHistory() {
  const c = await api("/api/conversations/current");
  log.replaceChildren();
  for (const m of c.messages) add(m.role, m.content, m.source);
  const last = c.messages.filter((m) => m.role === "assistant").pop();
  const lastYou = c.messages.filter((m) => m.role === "user").pop();
  if (last) subtitle(lastYou?.content || "", last.content);
}

function connect() {
  ws = new WebSocket(`ws://${location.host}/ws`);
  ws.onopen = () => ws.send(JSON.stringify({ type: "auth", token: TOKEN }));
  ws.onclose = () => {
    coreUp = false; $("chip-core").className = "chip warn"; $("chip-core").textContent = "CORE OFFLINE";
    renderSystems(); setTimeout(connect, 1500);
  };
  ws.onmessage = (e) => {
    const ev = JSON.parse(e.data);
    if (ev.type === "ready") {
      coreUp = true; $("chip-core").className = "chip on"; $("chip-core").textContent = "CORE ONLINE";
      loadHistory().then(loadApprovals); loadInbox(); loadMemories(); loadStatus(); loadWindows();
    }
    else if (ev.type === "approval_request") {
      host.notify("Jarvis needs your approval", actionTitle(ev.approval.tool) + " Open Jarvis to approve or reject.");
      showApproval(ev.approval);
    }
    else if (ev.type === "approval_decided") settleCard(ev.approval);
    else if (ev.type === "window") renderWindow(ev.window);
    else if (ev.type === "window_closed") dropWindow(ev.id);
    else if (ev.type === "start") {
      add("user", ev.text, ev.source); current = add("assistant", "");
      subtitle(ev.text, "…"); if (status) status.busy = true; renderSystems();
    }
    else if (ev.type === "delta" && current) {
      current.body.textContent += ev.text; subtitle(undefined, current.body.textContent); scrollLog();
    }
    else if (ev.type === "tool" && current) toolNote(ev.name);
    else if (ev.type === "untrusted") { untrusted = true; $("chip-untrusted").hidden = false; renderSystems(); }
    else if (ev.type === "memory_proposal") loadInbox();
    else if (ev.type === "memory_decided") { loadInbox(); loadMemories(); }
    else if (ev.type === "memory_review") {
      const parts = [];
      if (ev.saved.length) parts.push("saved " + ev.saved.join("; "));
      if (ev.pending.length) parts.push(ev.pending.length + " waiting for your approval");
      log.append(el("div", "note", "· looked back over the conversation: " + (parts.join(", ") || "nothing new"))); scrollLog();
      loadInbox(); loadMemories();
    }
    else if (["done", "interrupted", "error"].includes(ev.type) && "total_ms" in ev) {
      if (ev.type === "done" && document.hidden && current && ev.source !== "voice")
        host.notify("Jarvis", current.body.textContent.slice(0, 180));
      if (current) {
        if (ev.type === "interrupted") current.classList.add("cut");
        if (ev.type === "error") { current.classList.add("err"); current.body.textContent += (current.body.textContent ? "\n" : "") + "Error: " + ev.error; }
        subtitle(undefined, current.body.textContent || (ev.type === "interrupted" ? "Stopped." : ""));
      }
      current = null;
      Object.assign(lastCore, { first_token_ms: ev.first_token_ms, total_ms: ev.total_ms });
      loadStatus();
    }
    else if (ev.type === "new_conversation") {
      log.replaceChildren(); untrusted = false; $("chip-untrusted").hidden = true;
      subtitle("", "New conversation, sir."); loadStatus();
    }
    else if (ev.type === "error") add("assistant", "Error: " + ev.error).classList.add("err");
  };
}

$("chat").onsubmit = (e) => {
  e.preventDefault();
  const text = input.value.trim();
  if (!text || ws.readyState !== WebSocket.OPEN) return;
  ws.send(JSON.stringify({ type: "message", text, source: "typed" }));
  input.value = "";
};
input.onkeydown = (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("chat").requestSubmit(); } };
const stop = () => ws.send(JSON.stringify({ type: "interrupt" }));
$("stop").onclick = stop;
document.addEventListener("keydown", (e) => { if (e.key === "Escape") stop(); });
$("newchat").onclick = () => api("/api/conversations/new", { method: "POST" });

// ---------- pop-ups (the browser's notifications, when this tab isn't in front) ----------
const host = {
  notify(title, body) {
    if (!document.hidden && document.hasFocus()) return;
    if (window.Notification && Notification.permission === "granted") new Notification(title, { body });
  },
};
if (window.Notification && Notification.permission === "default")
  document.addEventListener("click", () => Notification.requestPermission(), { once: true });

// ---------- voice ----------
const voice = window.jarvisVoice;
const VSTATES = { off: "MIC OFF", connecting: "CONNECTING", idle: "STANDING BY", listening: "LISTENING",
                  thinking: "THINKING", speaking: "SPEAKING" };
voice.on("state", (s) => {
  $("vstate").textContent = VSTATES[s] || s.toUpperCase();
  $("talk").disabled = voice.micState !== "ptt";
});
voice.on("mic", (m) => {
  $("vmode").value = m === "off" && voice.state === "connecting" ? voice.mode : m;
  $("chip-mic").textContent = m === "off" ? "MIC OFF" : m === "ptt" ? "MIC · PUSH-TO-TALK" : "MIC · HANDS-FREE";
  $("chip-mic").className = "chip" + (m === "off" ? "" : " on");
  renderSystems();
});
voice.on("timings", (t) => {
  if ("heard_stop" in t) lastVoice.interrupt = t.heard_stop;
  else if (!("interrupt_stop" in t)) Object.assign(lastVoice, t);
  renderNumbers();
});
voice.on("log", (text) => { if (!text.startsWith("heard:")) { log.append(el("div", "note err", "· " + text)); scrollLog(); } });
$("vmode").onchange = (e) => (e.target.value === "off" ? voice.setMuted(true) : voice.connect(e.target.value));
const talk = $("talk");
talk.addEventListener("pointerdown", (e) => { talk.setPointerCapture(e.pointerId); voice.ptt(true); talk.classList.add("held"); });
const release = () => { voice.ptt(false); talk.classList.remove("held"); };
talk.addEventListener("pointerup", release);
talk.addEventListener("pointercancel", release);
const typing = (e) => ["TEXTAREA", "INPUT", "SELECT"].includes(e.target.tagName);
document.addEventListener("keydown", (e) => {
  if (e.code === "Space" && !e.repeat && !typing(e) && voice.micState === "ptt") { e.preventDefault(); voice.ptt(true); talk.classList.add("held"); }
});
document.addEventListener("keyup", (e) => { if (e.code === "Space" && !typing(e)) release(); });
window.addEventListener("blur", release);
if (voice.wantsOn && localStorage.getItem("voiceMode")) voice.connect();

setInterval(loadStatus, 30000);
renderSystems(); renderNumbers();
connect();
</script>
