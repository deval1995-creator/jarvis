<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jarvis</title>
<style>
  :root { color-scheme: light dark; --bg: #fafaf9; --fg: #1c1917; --muted: #78716c; --line: #e7e5e4;
          --me: #e0ecff; --accent: #2563eb; --panel: #f5f5f4; --warn: #b45309; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1c1917; --fg: #f5f5f4; --muted: #a8a29e; --line: #44403c; --me: #1e3a5f; --accent: #60a5fa;
            --panel: #292524; --warn: #fbbf24; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.5 system-ui, sans-serif; background: var(--bg); color: var(--fg);
         display: grid; grid-template-columns: 1fr 340px; grid-template-rows: auto 1fr; height: 100vh; }
  header { grid-column: 1 / -1; display: flex; align-items: center; gap: 12px; padding: 10px 16px;
           border-bottom: 1px solid var(--line); }
  header h1 { font-size: 16px; margin: 0; }
  #conn { font-size: 12px; color: var(--muted); }
  header .spacer { flex: 1; }
  main { display: flex; flex-direction: column; min-height: 0; }
  #log { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 75ch; padding: 8px 12px; border-radius: 10px; white-space: pre-wrap; }
  .user { align-self: flex-end; background: var(--me); }
  .assistant { align-self: flex-start; border: 1px solid var(--line); }
  .meta { font-size: 11px; color: var(--muted); margin-top: 4px; }
  .toolnote { align-self: flex-start; font-size: 12px; color: var(--muted); }
  .cut::after { content: " [interrupted]"; color: var(--muted); font-size: 12px; }
  .err { color: #dc2626; }
  form#chat { display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--line); }
  textarea, input[type=search], input[type=text] { font: inherit; padding: 8px 10px; border-radius: 8px;
             border: 1px solid var(--line); background: transparent; color: inherit; }
  textarea { flex: 1; resize: none; }
  button { font: inherit; font-size: 13px; padding: 5px 12px; border-radius: 8px; border: 1px solid var(--line);
           background: transparent; color: inherit; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: white; }
  #stats { font: 12px ui-monospace, monospace; color: var(--muted); padding: 0 16px 8px; }
  aside { border-left: 1px solid var(--line); background: var(--panel); overflow-y: auto; padding: 12px 14px;
          display: flex; flex-direction: column; gap: 10px; min-height: 0; }
  aside h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 6px 0 0; }
  .card { background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 10px; font-size: 14px; }
  .card.pending { border-color: var(--warn); }
  .card .tag { font-size: 11px; color: var(--muted); }
  .card .why { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .card .actions { display: flex; gap: 6px; margin-top: 8px; }
  .card input[type=text] { width: 100%; margin-top: 6px; }
  .empty { font-size: 13px; color: var(--muted); }
  #inboxCount { background: var(--warn); color: var(--bg); border-radius: 999px; padding: 0 7px; font-size: 12px; }
  .approval { align-self: stretch; max-width: 75ch; border: 2px solid var(--warn); border-radius: 12px; padding: 12px 14px; }
  .approval h3 { margin: 0 0 6px; font-size: 15px; }
  .approval dl { display: grid; grid-template-columns: max-content 1fr; gap: 4px 12px; margin: 0; font-size: 14px; }
  .approval dt { color: var(--muted); }
  .approval dd { margin: 0; white-space: pre-wrap; word-break: break-word; }
  .approval .warn { color: var(--warn); font-size: 13px; margin-top: 8px; }
  .approval .actions { display: flex; gap: 8px; margin-top: 10px; }
  .approval.decided { border-color: var(--line); opacity: .75; }
  .approval .outcome { font-weight: 600; margin-top: 8px; }
  .voice { display: flex; align-items: center; gap: 8px; font-size: 13px; }
  .voice select { font: inherit; font-size: 13px; padding: 4px 6px; border-radius: 8px; border: 1px solid var(--line);
                  background: transparent; color: inherit; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--muted); display: inline-block; }
  .dot.idle { background: #16a34a; } .dot.listening { background: var(--accent); }
  .dot.thinking { background: var(--warn); animation: pulse 1s infinite; } .dot.speaking { background: #a855f7; }
  .dot.off { background: transparent; border: 1px solid var(--muted); }
  @keyframes pulse { 50% { opacity: .35; } }
  #talk.held { background: var(--accent); border-color: var(--accent); color: white; }
  #talk { user-select: none; touch-action: none; }
</style>
</head>
<body>
<header>
  <h1>Jarvis</h1><span id="conn">connecting…</span>
  <span class="spacer"></span>
  <span class="voice">
    <span class="dot off" id="vdot"></span><span id="vstate">Mic off</span>
    <select id="vmode" title="Microphone">
      <option value="off">Mic off</option>
      <option value="ptt">Push-to-talk</option>
      <option value="hands-free">Hands-free</option>
    </select>
    <button id="talk" type="button" disabled title="Hold to talk (or hold Space when not typing)">Hold to talk</button>
  </span>
  <button id="newchat" type="button">New conversation</button>
</header>
<main>
  <div id="log"></div>
  <div id="stats"></div>
  <form id="chat">
    <textarea id="input" rows="2" placeholder="Message Jarvis (Enter to send, Shift+Enter for a new line, Esc to stop)" autofocus></textarea>
    <button id="stop" type="button">Stop</button>
    <button class="primary" type="submit">Send</button>
  </form>
</main>
<aside>
  <label class="empty"><input type="checkbox" id="autosave"> Save memories automatically (asks only for critical ones)</label>
  <h2>Needs your approval <span id="inboxCount" hidden></span></h2>
  <div id="inbox"></div>
  <h2>Saved memories</h2>
  <input type="search" id="memq" placeholder="Search memories">
  <div id="memories"></div>
</aside>
<script src="/static/voice.js"></script>
<script>
const TOKEN = "__JARVIS_TOKEN__";
const headers = { "X-Jarvis-Token": TOKEN, "Content-Type": "application/json" };
const $ = (id) => document.getElementById(id);
const log = $("log"), input = $("input"), connEl = $("conn"), stats = $("stats");
let ws, current = null;

const api = (path, opts = {}) => fetch(path, { headers, ...opts }).then(async (r) => {
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).detail || r.statusText);
  return r.json();
});

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}

function add(role, text, source) {
  const m = el("div", "msg " + role, text);
  if (source && source !== "typed") m.append(el("div", "meta", source));
  log.append(m); log.scrollTop = log.scrollHeight;
  return m;
}

const TOOL_LABELS = { recall: "checked memory", get_profile: "loaded your profile", remember: "noted to memory",
                      update: "updated a memory", forget: "removed a memory", log: "added a journal entry" };
function toolNote(name) {
  const short = name.replace(/^mcp__\w+?__/, "");
  const note = el("div", "toolnote", "· " + (TOOL_LABELS[short] || "used " + short));
  log.insertBefore(note, current); // above the reply it belongs to
}

// ---------- approval cards ----------
const ACTION_TITLES = {
  send_message: "Send this email?", reply: "Send this reply?", create_draft: "Save this draft in Gmail?",
  create_event: "Create this calendar event?", update_event: "Change this calendar event?",
  respond_to_event: "Answer this invitation?",
};
const OUTCOMES = { approved: "Approved", rejected: "Rejected", expired: "Expired: no answer in 10 minutes",
                   cancelled: "Cancelled" };
const cards = new Map();

function fmt(v) {
  if (Array.isArray(v)) return v.map(fmt).join(", ");
  if (v && typeof v === "object") return Object.entries(v).map(([k, x]) => `${k}: ${fmt(x)}`).join("\n");
  return String(v);
}

function approvalCard(a) {
  const short = a.tool.replace(/^mcp__\w+?__/, "");
  const c = el("div", "approval");
  c.append(el("h3", "", ACTION_TITLES[short] || `Allow ${short}?`));
  const dl = el("dl");
  for (const [k, v] of Object.entries(a.arguments)) {
    if (v === null || v === "" || (Array.isArray(v) && !v.length)) continue;
    dl.append(el("dt", "", k.replace(/_/g, " ")), el("dd", "", fmt(v)));
  }
  c.append(dl);
  if (a.untrusted) c.append(el("div", "warn",
    "⚠ This conversation has read email or calendar content written by other people. Check this is what you asked for."));
  const actions = el("div", "actions");
  const yes = el("button", "primary", "Approve"), no = el("button", "", "Reject");
  yes.onclick = () => api(`/api/approvals/${a.id}/approve`, { method: "POST" }).catch((e) => alert(e.message));
  no.onclick = () => api(`/api/approvals/${a.id}/reject`, { method: "POST" }).catch((e) => alert(e.message));
  actions.append(yes, no); c.append(actions);
  cards.set(a.id, c);
  if (a.status !== "pending") settleCard(a);
  return c;
}

function settleCard(a) {
  const c = cards.get(a.id);
  if (!c) return;
  c.classList.add("decided");
  c.querySelector(".actions")?.remove();
  if (!c.querySelector(".outcome")) c.append(el("div", "outcome", OUTCOMES[a.status] || a.status));
}

async function loadApprovals() {
  for (const a of await api("/api/approvals")) {
    if (!cards.has(a.id)) { log.append(approvalCard(a)); log.scrollTop = log.scrollHeight; }
  }
}

// ---------- memory panel ----------
function describe(p) {
  if (p.action === "forget") return "Forget: " + p.text;
  if (p.action === "update") return "Change to: " + p.text;
  return p.text;
}

function proposalCard(p) {
  const c = el("div", "card pending");
  c.dataset.id = p.id;
  c.append(el("div", "tag", [p.action, p.kind, p.category, p.confidence && p.confidence < 1 ? "inferred" : null]
    .filter(Boolean).join(" · ")));
  c.append(el("div", "", describe(p)));
  if (p.review_reason) c.append(el("div", "why", "Needs you: " + p.review_reason));
  const actions = el("div", "actions");
  const yes = el("button", "primary", "Approve"), edit = el("button", "", "Edit"), no = el("button", "", "Reject");
  let editor = null;
  edit.onclick = () => {
    if (editor || p.action === "forget") return;
    editor = el("input"); editor.type = "text"; editor.value = p.text;
    c.insertBefore(editor, actions); editor.focus();
  };
  yes.onclick = async () => {
    await api(`/api/memory/proposals/${p.id}/approve`, { method: "POST",
      body: JSON.stringify(editor ? { text: editor.value } : {}) }).catch((e) => alert(e.message));
  };
  no.onclick = () => api(`/api/memory/proposals/${p.id}/reject`, { method: "POST" }).catch((e) => alert(e.message));
  actions.append(yes);
  if (p.action !== "forget") actions.append(edit);
  actions.append(no);
  c.append(actions);
  return c;
}

async function loadInbox() {
  const items = await api("/api/memory/proposals");
  const box = $("inbox");
  box.replaceChildren(...(items.length ? items.map(proposalCard) : [el("div", "empty", "Nothing waiting.")]));
  $("autosave").checked = (await api("/api/memory/settings/auto-approve")).enabled;
  $("inboxCount").hidden = !items.length;
  $("inboxCount").textContent = items.length;
}

async function loadMemories() {
  const q = $("memq").value.trim();
  const items = await api("/api/memory" + (q ? "?q=" + encodeURIComponent(q) : ""));
  const box = $("memories");
  box.replaceChildren(...(items.length ? items.map((m) => {
    const c = el("div", "card");
    c.append(el("div", "tag", [m.kind, m.category, m.pinned ? "pinned" : null, "importance " + m.importance]
      .filter(Boolean).join(" · ")));
    c.append(el("div", "", m.text));
    const actions = el("div", "actions");
    const pin = el("button", "", m.pinned ? "Unpin" : "Pin"), del = el("button", "", "Delete");
    pin.onclick = () => api(`/api/memory/${m.id}`, { method: "PATCH", body: JSON.stringify({ pinned: !m.pinned }) }).then(loadMemories);
    del.onclick = () => confirm("Delete this memory?") &&
      api(`/api/memory/${m.id}`, { method: "DELETE" }).then(loadMemories);
    actions.append(pin, del); c.append(actions);
    return c;
  }) : [el("div", "empty", q ? "No matches." : "No memories saved yet.")]));
}
$("autosave").onchange = (e) => api("/api/memory/settings/auto-approve",
  { method: "PUT", body: JSON.stringify({ enabled: e.target.checked }) });
let memTimer;
$("memq").oninput = () => { clearTimeout(memTimer); memTimer = setTimeout(loadMemories, 250); };

// ---------- chat ----------
async function loadHistory() {
  const c = await api("/api/conversations/current");
  log.replaceChildren();
  for (const m of c.messages) add(m.role, m.content, m.source);
}

function connect() {
  ws = new WebSocket(`ws://${location.host}/ws`);
  ws.onopen = () => ws.send(JSON.stringify({ type: "auth", token: TOKEN }));
  ws.onclose = () => { connEl.textContent = "disconnected, retrying…"; setTimeout(connect, 1500); };
  ws.onmessage = (e) => {
    const ev = JSON.parse(e.data);
    if (ev.type === "ready") {
      connEl.textContent = "connected";
      loadHistory().then(loadApprovals); loadInbox(); loadMemories();
    }
    else if (ev.type === "approval_request") {
      host.notify("Jarvis needs your approval", (ACTION_TITLES[ev.approval.tool.replace(/^mcp__\w+?__/, "")]
        || "An action is waiting") + " Open Jarvis to approve or reject.");
      const card = approvalCard(ev.approval);
      if (current) log.insertBefore(card, current); else log.append(card);
      log.scrollTop = log.scrollHeight;
    }
    else if (ev.type === "approval_decided") { settleCard(ev.approval); }
    else if (ev.type === "start") { add("user", ev.text, ev.source); current = add("assistant", ""); }
    else if (ev.type === "delta" && current) { current.textContent += ev.text; log.scrollTop = log.scrollHeight; }
    else if (ev.type === "tool" && current) { toolNote(ev.name); }
    else if (ev.type === "memory_proposal") { loadInbox(); }
    else if (ev.type === "memory_decided") { loadInbox(); loadMemories(); }
    else if (ev.type === "memory_review") {
      const parts = [];
      if (ev.saved.length) parts.push("saved " + ev.saved.join("; "));
      if (ev.pending.length) parts.push(ev.pending.length + " waiting for your approval");
      const note = el("div", "toolnote", "· looked back over the conversation: " + parts.join(", "));
      log.append(note); log.scrollTop = log.scrollHeight;
      loadInbox(); loadMemories();
    }
    else if (["done", "interrupted", "error"].includes(ev.type) && "total_ms" in ev) {
      if (ev.type === "done" && document.hidden && current && ev.source !== "voice")
        host.notify("Jarvis", current.textContent.slice(0, 180));
      if (current) {
        if (ev.type === "interrupted") current.classList.add("cut");
        if (ev.type === "error") { current.classList.add("err"); current.textContent += (current.textContent ? "\n" : "") + "Error: " + ev.error; }
      }
      current = null;
      stats.textContent = `last turn: first token ${ev.first_token_ms ?? "–"} ms · total ${ev.total_ms} ms`;
    }
    else if (ev.type === "new_conversation") { log.replaceChildren(); stats.textContent = ""; }
    else if (ev.type === "error") { add("assistant", "Error: " + ev.error).classList.add("err"); }
  };
}

$("chat").onsubmit = (e) => {
  e.preventDefault();
  const text = input.value.trim();
  if (!text || ws.readyState !== WebSocket.OPEN) return;
  ws.send(JSON.stringify({ type: "message", text, source: "typed" }));
  input.value = "";
};
input.onkeydown = (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("chat").requestSubmit(); }
};
const stop = () => ws.send(JSON.stringify({ type: "interrupt" }));
$("stop").onclick = stop;
document.addEventListener("keydown", (e) => { if (e.key === "Escape") stop(); });
$("newchat").onclick = () => api("/api/conversations/new", { method: "POST" });

// ---------- the desktop app (Tauri), when this page runs inside it ----------
const tauri = window.__TAURI__;
const host = {
  notify(title, body) {
    if (!document.hidden && document.hasFocus()) return;  // already looking at it
    if (tauri) tauri.core.invoke("notify", { title, body }).catch(() => {});
    else if (window.Notification && Notification.permission === "granted") new Notification(title, { body });
  },
  mic(state) { if (tauri) tauri.core.invoke("mic_state", { state }).catch(() => {}); },
};

// ---------- voice ----------
const voice = window.jarvisVoice;
const VSTATES = { off: "Mic off", connecting: "Connecting…", idle: "Ready", listening: "Listening",
                  thinking: "Thinking", speaking: "Speaking" };
const lastVoice = {};
voice.on("state", (s) => {
  $("vdot").className = "dot " + s;
  $("vstate").textContent = VSTATES[s] || s;
  $("talk").disabled = !(voice.micState === "ptt");
});
voice.on("mic", (m) => { $("vmode").value = m === "off" && voice.state === "connecting" ? voice.mode : m; host.mic(m); });
voice.on("timings", (t) => {
  if ("interrupt_stop" in t || "heard_stop" in t) {
    if ("heard_stop" in t) lastVoice.interrupt = t.heard_stop;
  } else Object.assign(lastVoice, t, { interrupt: undefined });
  const ms = (v) => (v === undefined ? "–" : v);
  stats.textContent = `voice: heard ${ms(lastVoice.transcribe)} ms · first audio ${ms(lastVoice.first_audio)} ms`
    + ` · reply ${ms(lastVoice.total)} ms` + (lastVoice.interrupt !== undefined ? ` · interruption stopped in ${lastVoice.interrupt} ms` : "");
});
voice.on("log", (text) => { if (!text.startsWith("heard:")) { const n = el("div", "toolnote err", "· " + text); log.append(n); } });
$("vmode").onchange = (e) => (e.target.value === "off" ? voice.setMuted(true) : voice.connect(e.target.value));
const talk = $("talk");
talk.addEventListener("pointerdown", (e) => { talk.setPointerCapture(e.pointerId); voice.ptt(true); talk.classList.add("held"); });
const release = () => { voice.ptt(false); talk.classList.remove("held"); };
talk.addEventListener("pointerup", release);
talk.addEventListener("pointercancel", release);
const typing = (e) => ["TEXTAREA", "INPUT", "SELECT"].includes(e.target.tagName);
document.addEventListener("keydown", (e) => {
  if (e.code === "Space" && !e.repeat && !typing(e) && voice.micState === "ptt") { e.preventDefault(); voice.ptt(true); talk.classList.add("held"); }
});
document.addEventListener("keyup", (e) => { if (e.code === "Space" && !typing(e)) release(); });
window.addEventListener("blur", release);
if (voice.wantsOn && localStorage.getItem("voiceMode")) voice.connect();
// The desktop app's hotkeys and tray call these.
window.jarvis = {
  ptt: (down) => { voice.ptt(down); talk.classList.toggle("held", down); },
  toggleMute: () => voice.toggleMute(),
  focusInput: () => input.focus(),
};
connect();
</script>
</body>
</html>
