<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Jarvis</title>
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; height: 100vh; display: grid; place-items: center; font: 15px/1.5 system-ui, sans-serif;
         background: #1c1917; color: #f5f5f4; }
  .box { text-align: center; }
  .ring { width: 56px; height: 56px; margin: 0 auto 16px; border-radius: 50%; border: 5px solid #60a5fa;
          border-top-color: transparent; animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  #note { color: #a8a29e; font-size: 13px; }
</style>
</head>
<body>
<div class="box">
  <div class="ring"></div>
  <div>Starting Jarvis…</div>
  <div id="note"></div>
</div>
<script>
// Shown while the app starts the Core; then the window switches to the Core's page.
const CORE = "http://127.0.0.1:8765";
const started = Date.now();
async function poll() {
  try {
    await fetch(CORE + "/quick", { mode: "no-cors", cache: "no-store" });  // any answer means it's up
    location.replace(CORE + "/");
  } catch {
    const s = Math.round((Date.now() - started) / 1000);
    if (s > 20) document.getElementById("note").textContent =
      `Still waiting for the Core (${s} s). Its log is in %LOCALAPPDATA%\Jarvis\logs\core.log`;
    setTimeout(poll, 500);
  }
}
poll();
</script>
</body>
</html>
