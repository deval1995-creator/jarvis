<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ask Jarvis</title>
<style>
  :root { color-scheme: dark; --bg: #1c1917; --fg: #f5f5f4; --muted: #a8a29e; --line: #44403c; --accent: #60a5fa; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 15px/1.5 system-ui, sans-serif; }
  body { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  input { font: inherit; font-size: 17px; width: 100%; padding: 14px 16px; border: 0; border-bottom: 1px solid var(--line);
          background: transparent; color: inherit; outline: none; }
  #reply { flex: 1; overflow-y: auto; padding: 12px 16px; white-space: pre-wrap; }
  #reply:empty::before { content: "Ask anything. Enter to send, Esc to close."; color: var(--muted); }
  .note { color: var(--muted); font-size: 13px; }
  .warn { color: #fbbf24; }
</style>
</head>
<body>
<input id="q" placeholder="Ask Jarvis…" autofocus autocomplete="off">
<div id="reply"></div>
<script>
const TOKEN = "__JARVIS_TOKEN__";
const q = document.getElementById("q"), reply = document.getElementById("reply");
const tauri = window.__TAURI__;
let ws, mine = null, active = false;

function hide() {
  if (tauri) tauri.core.invoke("hide_quick").catch(() => {});
}

function connect() {
  ws = new WebSocket(`ws://${location.host}/ws`);
  ws.onopen = () => ws.send(JSON.stringify({ type: "auth", token: TOKEN }));
  ws.onclose = () => setTimeout(connect, 1500);
  ws.onmessage = (e) => {
    const ev = JSON.parse(e.data);
    if (ev.type === "start") active = ev.text === mine && ev.source === "typed";
    else if (!active) return;
    else if (ev.type === "delta") reply.append(ev.text);
    else if (ev.type === "approval_request") {
      const n = document.createElement("div");
      n.className = "note warn"; n.textContent = "\nWaiting for your approval in the Jarvis window.";
      reply.append(n);
    }
    else if (["done", "interrupted", "error"].includes(ev.type)) {
      active = false;
      if (ev.type === "error") reply.append("\nError: " + ev.error);
    }
  };
}

q.onkeydown = (e) => {
  if (e.key === "Escape") hide();  // the answer keeps going in the main window
  if (e.key !== "Enter" || !q.value.trim() || ws.readyState !== WebSocket.OPEN) return;
  mine = q.value.trim();
  reply.textContent = "";
  ws.send(JSON.stringify({ type: "message", text: mine, source: "typed" }));
  q.value = "";
};
// Each time the app shows this box: a fresh question.
window.jarvisQuick = { reset() { q.value = ""; q.focus(); } };
window.addEventListener("focus", () => q.focus());
connect();
</script>
</body>
</html>
